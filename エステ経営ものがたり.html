<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261117"><link rel="icon" type="image/png" href="favicon.png?v=20261117"><meta name="apple-mobile-web-app-title" content="エステ経営"></head><body>
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>エステ経営ものがたり</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  :root {
    --bg: #F3EBDD;
    --panel: #FFFDF7;
    --ink: #2B2238;
    --sub: #6A5F78;
    --line: #D8CCBA;
    --accent: #D9466F;
    --accent-ink: #FFFFFF;
    --gold: #A87708;
    --good: #24805F;
    --chip: #F6EEE1;
    --int: #D99A1E;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1C1726; --panel: #2A2336; --ink: #F3ECDF; --sub: #B5A9C6; --line: #4A3F62;
      --accent: #FF7FA0; --accent-ink: #1C1726; --gold: #E8C15A; --good: #6FD3A8; --chip: #352C47; --int: #F0B840;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1C1726; --panel: #2A2336; --ink: #F3ECDF; --sub: #B5A9C6; --line: #4A3F62;
    --accent: #FF7FA0; --accent-ink: #1C1726; --gold: #E8C15A; --good: #6FD3A8; --chip: #352C47; --int: #F0B840;
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
    font-size: 15px; line-height: 1.6;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;  /* ダブルタップで拡大しない */
  }
  html, button, a, input, select, canvas { touch-action: manipulation; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 0 16px 28px; }

  /* 上の帯と店内の絵（いつも見えるように固定） */
  .head {
    position: sticky; top: 0; z-index: 5;
    margin: 0 -16px; padding: env(safe-area-inset-top, 0px) 16px 8px;
    background: var(--bg); border-bottom: 3px solid var(--ink);
  }
  .bar {
    display: grid; grid-template-columns: auto 1fr auto; gap: 0 10px; align-items: center;
    padding: 8px 0 6px;
  }
  .bar .week { font-size: 1rem; }
  .bar .brand { grid-column: 1 / -1; font-size: .78rem; color: var(--accent); line-height: 1.3; }
  .bar .money { text-align: right; font-size: 1.12rem; font-variant-numeric: tabular-nums; }
  .bar .money.minus { color: var(--accent); }
  .bar .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--sub); }
  .hcond { display: grid; grid-template-columns: 6.5em 1fr; gap: 8px 10px; margin: 0; font-size: .9rem; line-height: 1.55; }
  .hcond dt { color: var(--sub); white-space: nowrap; }
  .hcond dd { margin: 0; }
  #app .trw { margin: 16px 0 6px; font-size: 1rem; }
  .bar .top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bar .top .brand { min-width: 0; }
  .bar .ttl { font: inherit; font-size: .72rem; margin: 0; padding: 1px 8px; min-height: 24px; width: auto; cursor: pointer; flex: none; background: transparent; color: var(--sub); border: 1px solid var(--line); box-shadow: none; }
  .bar .sub { flex-wrap: wrap; justify-content: flex-start; gap: 2px 12px; }
  .bar .sub span { white-space: nowrap; }
  .ver { margin: 14px 0 0; text-align: center; font-size: .72rem; color: var(--sub); }
  .qlist .si { display: block; margin-top: 2px; font-weight: 400; font-size: .78rem; color: var(--accent); }
  .qlist .who-list { margin: 0 10px 10px; }
  .epsum { display: grid; gap: 8px; margin: 0 0 10px; }
  .epsum .es { padding: 8px 12px; background: var(--panel); border: 2px solid var(--line); }
  .epsum .es b { font-size: .92rem; } .epsum .es small { margin-left: 8px; font-size: .74rem; color: var(--sub); }
  .epsum .es p { margin: 4px 0 0; font-size: .86rem; line-height: 1.55; }
  .epsum .es p.l2 { margin-top: 2px; color: var(--sub); }
  .esfin { display: grid; gap: 8px; margin: 0 0 16px; }
  .esrep { display: grid; justify-items: end; gap: 8px; }
  .esrep button { width: auto; max-width: 92%; margin: 0; padding: 9px 14px; text-align: left; border-radius: 18px 18px 4px 18px; border: 2px solid var(--accent); background: var(--panel); color: var(--ink); box-shadow: 2px 2px 0 var(--accent); }
  .tgl { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding: 10px 12px; }
  .tgl b { display: block; font-size: .95rem; }
  .tgl small { display: block; font-size: .76rem; color: var(--sub); line-height: 1.45; }
  .seg { display: flex; flex: none; border: 2px solid var(--ink); }
  .seg button { margin: 0; width: auto; min-width: 54px; min-height: 36px; padding: 4px 10px; text-align: center; font-weight: 700; border: 0; box-shadow: none; background: var(--panel); color: var(--sub); }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .bar .bn { display: inline-block; }
  .bar .cpt { display: inline-block; margin-right: 8px; padding: 0 8px; font-size: .72rem; color: var(--ink); background: var(--panel); border: 2px solid var(--cc); vertical-align: 1px; }
  .ttlask { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 14, 28, .55); }
  .ttlask .box { width: min(360px, 100%); margin: 0; padding: 16px; display: grid; gap: 10px; }
  .ttlask h2 { margin: 0; }
  .ttlask p { margin: 0; font-size: .9rem; line-height: 1.6; }
  .ttlask button { width: 100%; margin: 0; }
  .snd {
    font: inherit; font-size: .74rem; min-height: 30px; padding: 3px 9px; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  }
  .scene { display: flex; justify-content: center; }
  .scene canvas {
    display: block; height: min(31vh, 230px); width: auto; aspect-ratio: 128 / 84; max-width: 100%;
    image-rendering: crisp-edges; image-rendering: pixelated;
    border: 3px solid var(--ink); background: #F6D9D6;
  }

  h1 { font-weight: 400; font-size: 1.6rem; line-height: 1.3; margin: 18px 0 6px; }
  p { margin: 0 0 10px; }
  .lead { color: var(--sub); font-size: .92rem; }
  .box { background: var(--panel); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }

  /* カルテ */
  .karte { margin-top: 14px; padding: 10px 12px; }
  .kh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .kh b { font-weight: 400; font-size: 1.15rem; }
  .kh span, .ag { font-size: .78rem; color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chips span { font-size: .76rem; padding: 1px 8px; background: var(--chip); border: 2px solid var(--line); }
  .chips span.q { color: var(--sub); border-style: dashed; }
  .gauges { display: grid; grid-template-columns: auto 1fr 2.2em; gap: 4px 8px; align-items: center; margin-top: 8px; font-size: .78rem; }
  .gauges i { display: block; height: 10px; background: var(--chip); border: 2px solid var(--ink); overflow: hidden; }
  .gauges u { display: block; height: 100%; background: var(--good); }
  .gauges u.int { background: var(--int); } .gauges u.grd { background: var(--accent); } .gauges u.loy { background: #8E6CD8; }
  .gauges b { text-align: right; font-weight: 400; font-variant-numeric: tabular-nums; }

  /* 会話 */
  .talk { margin-top: 10px; display: grid; gap: 6px; }
  .say { max-width: 90%; padding: 6px 10px; font-size: .9rem; line-height: 1.5; border: 2px solid var(--ink); }
  .say.me { justify-self: end; background: var(--ink); color: var(--bg); }
  .opts.replies { justify-items: end; gap: 10px; }
  .opts.replies button { width: auto; max-width: 92%; padding: 10px 16px; text-align: left; border-radius: 18px 18px 4px 18px; border: 2px solid var(--accent); background: var(--panel); color: var(--ink); box-shadow: 2px 2px 0 var(--accent); }
  .opts.replies button b { font-weight: 400; }
  .say.you { justify-self: start; background: var(--panel); }
  .dotbar { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; padding: 6px 10px; background: var(--ink); color: var(--bg); font-size: .9rem; }
  .dotbar b { font-size: 1.05rem; letter-spacing: .04em; }
  .say .who { display: block; font-size: .72rem; color: var(--sub); }
  /* 仕入れ：商品ごとのカード */
  .stkgrp { margin: 14px 0 6px; font-size: .95rem; color: var(--sub); border-bottom: 2px solid var(--line); padding-bottom: 2px; }
  .stk { margin: 8px 0; padding: 10px 12px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .stk-h { display: flex; align-items: center; gap: 8px; }
  .stk-sw { flex: none; width: 14px; height: 18px; border: 2px solid var(--ink); }
  .stk-nm { flex: 1; min-width: 0; font-size: 1.02rem; color: var(--accent); }
  .stk-n { flex: none; font-size: .85rem; }
  .stk-n b { font-size: 1.15rem; }
  .stk-n.low b { color: var(--accent); }
  .stk-sub { margin: 2px 0 8px 22px; font-size: .78rem; color: var(--sub); }
  .stk-fit { color: var(--good); font-weight: 700; }
  .stk-buy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stk-buy button { margin: 0; padding: 6px 8px; text-align: center; font-size: .92rem; box-shadow: 2px 2px 0 var(--ink); }
  .stk-auto { display: flex; align-items: center; gap: 8px; margin: 10px 0 0 14px; padding: 6px 10px; background: var(--chip); border-left: 4px solid var(--gold); font-size: .85rem; }
  .stk-auto span { flex: 1; }
  .stk-auto button { flex: none; width: 44px; height: 36px; margin: 0; padding: 0; text-align: center; font-size: 1.1rem; box-shadow: 2px 2px 0 var(--ink); }
  .stk-auto b { min-width: 4.5em; text-align: center; }
  .prof { margin: 8px 0; padding: 8px 10px; font-size: .82rem; line-height: 1.6; background: var(--chip); border-left: 4px solid var(--gold); }
  .karte .first { margin-top: 6px; padding: 4px 8px; font-size: .8rem; line-height: 1.5; color: var(--ink); background: var(--chip); border-left: 4px solid var(--accent); }
  /* スタッフと過ごす：ドット絵のカードを横に並べる */
  .strow-h { margin: 14px 0 4px; font-size: .9rem; color: var(--sub); }
  .stcards { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  .stcard { flex: none; width: 124px; margin: 0; padding: 8px 8px 10px; text-align: center; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
  .stcard canvas { display: block; width: 84px; height: 90px; margin: 0 auto 6px; image-rendering: pixelated; background: var(--chip); border: 2px solid var(--line); }
  .stcard .nm { display: block; font-size: .92rem; line-height: 1.3; }
  .stcard .rl { display: inline-block; align-self: center; margin: 2px 0; padding: 0 6px; font-size: .7rem; background: var(--accent); color: var(--accent-ink); }
  .stcard .tp { display: block; font-size: .72rem; color: var(--sub); }
  .stcard .mb { display: block; height: 6px; margin: 6px 4px 2px; background: var(--line); }
  .stcard .mb u { display: block; height: 100%; background: var(--good); }
  .stcard .mb u.lo { background: var(--accent); }
  .stcard.hasep { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); position: relative; }
  .stcard .eptag { display: block; margin: -2px 0 4px; font-size: .72rem; font-weight: 700; color: var(--accent); }
  .frbox { margin: 10px 0; padding: 8px 10px; background: var(--chip); border-left: 4px solid var(--gold); }
  .frbox b { display: block; margin-bottom: 4px; font-size: .9rem; }
  .epbox .optbtn, .frbox .optbtn { background: var(--accent); color: var(--accent-ink); text-align: center; margin: 4px 0 8px; }
  .frbox .optbtn small { color: inherit; opacity: .9; }
  .frbox button { display: block; width: 100%; margin: 4px 0 0; padding: 6px 8px; text-align: left; font-size: .88rem; }
  .stcard .frtag { display: block; margin: -2px 0 4px; font-size: .72rem; color: var(--gold); }
  .epbox { margin: 10px 0; padding: 10px 12px; background: var(--panel); border: 3px solid var(--accent); box-shadow: 3px 3px 0 var(--accent); }
  .epbox b { display: block; margin-bottom: 6px; color: var(--accent); }
  .epbtns { display: grid; gap: 6px; }
  .epbtns button { margin: 0; padding: 8px 10px; text-align: left; }
  .cdlist { display: grid; gap: 10px; margin: 10px 0; }
  .cdcard { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto; gap: 6px 10px; padding: 10px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .cdcard canvas { grid-row: 1 / 3; width: 64px; height: 68px; image-rendering: pixelated; background: var(--chip); border: 2px solid var(--line); }
  .cdinfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: .82rem; }
  .cdinfo .nm { font-size: 1rem; }
  .cdinfo .nm .ag { margin-left: 6px; font-size: .74rem; color: var(--sub); font-weight: 400; display: inline; }
  .cdinfo .nm .mk { margin-left: 6px; padding: 0 6px; font-size: .68rem; font-weight: 400; background: #3E5A78; color: #FFFFFF; }
  .cdinfo .tr { color: var(--accent); font-size: .8rem; }
  .cdinfo .row { display: flex; gap: 8px; align-items: baseline; }
  .cdinfo .lb { flex: none; width: 4.2em; color: var(--sub); font-size: .76rem; }
  .cdinfo .gs { color: var(--gold); letter-spacing: .08em; white-space: nowrap; }
  .cdinfo .sk { color: var(--sub); font-size: .76rem; }
  .cdinfo small { color: var(--sub); font-size: .72rem; line-height: 1.4; }
  .cdhire { grid-column: 2; margin: 0; padding: 6px 10px; text-align: center; }
  .stcard .ep { display: block; font-size: .7rem; color: var(--accent); margin-top: 2px; }
  /* dot.（メッセージアプリ）の画面 */
  .dotapp { margin: 8px 0 12px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); overflow: hidden; }
  .dotapp .dh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--ink); color: var(--bg); }
  .dotapp .dh b { font-size: 1.05rem; letter-spacing: .04em; }
  .dotapp .dh span { font-size: .82rem; opacity: .85; flex: 1; min-width: 0; }
  .dotapp .dh .cnt { flex: none; padding: 0 8px; background: var(--accent); color: var(--accent-ink); font-size: .74rem; }
  .dotapp.off .dh { background: #3E5A78; color: #FFFFFF; }
  .dotrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; width: 100%; margin: 0; padding: 10px 12px; text-align: left; border: 0; border-bottom: 1px solid var(--line); box-shadow: none; background: transparent; }
  .dotrow:last-child { border-bottom: 0; }
  .dotrow .nm { display: block; font-size: .95rem; color: var(--ink); }
  .dotrow .pv { display: block; font-size: .8rem; line-height: 1.5; color: var(--sub); }
  .dotrow > span:nth-child(2) { min-width: 0; }
  .dotrow .st { white-space: nowrap; font-size: .72rem; padding: 1px 8px; border: 1px solid var(--line); color: var(--sub); }
  .dotrow .st.new { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dav { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: #FFFFFF; font-size: .95rem; font-weight: 700; flex: none; }
  .dchat { display: grid; gap: 10px; padding: 12px; background: var(--bg); }
  .dmsg { display: flex; gap: 8px; align-items: flex-end; }
  .dmsg .dav { width: 30px; height: 30px; font-size: .8rem; }
  .dmsg .bb { max-width: 78%; padding: 8px 12px; font-size: .9rem; line-height: 1.55; background: var(--panel); border: 2px solid var(--ink); border-radius: 14px 14px 14px 2px; }
  .dmsg .bb .who { display: block; font-size: .7rem; color: var(--sub); margin-bottom: 2px; }
  .dmsg.me { justify-content: flex-end; }
  .dmsg.me .bb { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-radius: 14px 14px 2px 14px; }
  .dnote { justify-self: center; padding: 4px 12px; font-size: .78rem; color: var(--sub); background: var(--panel); border: 1px dashed var(--line); }
  .dreply { display: grid; gap: 8px; padding: 10px 12px 12px; border-top: 2px solid var(--line); background: var(--panel); }
  .dreply .lb { font-size: .76rem; color: var(--sub); }
  .dreply button { margin: 0; padding: 8px 14px; text-align: left; border-radius: 18px; box-shadow: none; border: 2px solid var(--accent); color: var(--ink); background: var(--panel); }
  .dreply button small { display: inline; margin-left: 6px; }
  .dreply button.later { border-color: var(--line); color: var(--sub); text-align: center; }
  .say.note { justify-self: center; max-width: 100%; border: 0; background: transparent; color: var(--sub); font-size: .82rem; text-align: center; padding: 0; }
  .say.good { border-color: var(--good); box-shadow: 3px 3px 0 var(--good); }
  .say.bad { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); }

  .step { margin: 14px 0 8px; font-size: 1rem; }
  .step small { display: block; font-size: .8rem; color: var(--sub); }
  .opts { display: grid; gap: 9px; }
  .topback { display: inline-block; width: auto; min-height: 36px; margin: 0 0 8px; padding: 6px 12px; font-size: .85rem; font-weight: 700; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  /* ふつうの選択肢：ひとつのパネルに、線で区切って並べる（四角がたくさん並ばないように） */
  .olist { display: grid; background: var(--panel); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
  .olist > button, details.fold.grp > .opts > button { position: relative; min-height: 50px; margin: 0; padding: 9px 30px 9px 12px; border: 0; border-top: 1px solid var(--line); box-shadow: none; background: transparent; }
  .olist > button:first-child, details.fold.grp > .opts > button:first-child { border-top: 0; }
  .olist > button::after, details.fold.grp > .opts > button::after { content: '›'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--sub); font-size: 1.25rem; line-height: 1; }
  .olist > button:disabled::after, details.fold.grp > .opts > button:disabled::after { content: ''; }
  .olist > button:active:not(:disabled), details.fold.grp > .opts > button:active:not(:disabled) { transform: none; box-shadow: none; background: var(--chip); }
  .olist > button.picked, details.fold.grp > .opts > button.picked { background: var(--chip); }
  .olist > button.picked b::before { content: '✓ '; color: var(--accent); }
  details.fold.grp > .opts { gap: 0; padding: 0 !important; border-top: 1px solid var(--line); }
  .hqlist li > span:last-child { flex: none; white-space: nowrap; text-align: right; }
  .osec { margin: 10px 0 -3px; font-size: .82rem; font-weight: 700; color: var(--sub); }
  details.more { margin: 0 0 8px; }
  details.more > summary { display: inline-block; cursor: pointer; font-size: .8rem; color: var(--accent); list-style: none; padding: 2px 0; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::after { content: ' ▼'; font-size: .65rem; }
  details.more[open] > summary::after { content: ' ▲'; }
  details.more > .lead { margin-top: 4px; }
  button {
    font: inherit; cursor: pointer; text-align: left;
    min-height: 48px; padding: 7px 12px;
    background: var(--panel); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 0; box-shadow: 3px 3px 0 var(--ink);
  }
  button b { display: block; font-weight: 400; font-size: .98rem; line-height: 1.35; }
  button small { display: block; font-size: .76rem; line-height: 1.4; color: var(--sub); }
  button.main { background: var(--accent); color: var(--accent-ink); text-align: center; }
  button.main small { color: inherit; opacity: .9; }
  button.picked { background: var(--chip); }
  button:disabled { opacity: .42; cursor: default; }
  button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:focus-visible, .snd:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* 帳簿 */
  .slip { margin-top: 12px; padding: 10px 12px; }

  /* --- スタッフに任せる（自動） --- */

    doneScreen(r.tone, r.lines.join('<br>') + (C.press ? '' : '<br>このお客様の売上 ' + yen(C.revenue)));
  }
  function autoCore() {
    var st = C.st, tr = st.trait, lines = [];
    var need = C.isNew ? C.concern : C.today;
    var avail = Object.keys(SUBMENU).filter(subOk);
    var menu = (avail.indexOf(need) >= 0 && (st.trait === 'listen' || roll(C.isNew ? 0.3 + 0.06 * sk(st, 'listen') + 0.05 * sk(st, 'know') : (S.ekarte ? 1 : 0.9)))) ? need :
      (pick(avail.filter(function (k) { return catOf(k) === catOf(need); })) || pick(avail.filter(function (k) { return NEAR[catOf(need)].indexOf(catOf(k)) >= 0; })) || pick(avail));
    var oils = myOils(), bl = menu === 'aroma' ? (oils.length && C.budget >= 1 && roll(0.6) ? 'my:' + oils[0].k : (S.aromaPro && C.budget >= 2 ? 'premium' : (C.budget >= 1 ? 'season' : 'relax'))) : null;
    C.menu = catOf(menu); C.sub = menu; C.blend = bl;
    var press = (!C.isNew || st.trait === 'listen' || roll(0.25 + 0.1 * sk(st, 'listen') + 0.03 * sk(st, 'emp'))) ? C.pref : pick(Object.keys(PRESS));
    C.sat = clamp(satCalc(menu, press, st, bl).sat + (C.plan && (courseOf(C.plan.k) || {}).multi ? 6 : 0), 5, 100); C.missSt = null;
    pressLoad(st, press);
    blendPay(bl);
    reputeBySat();
    lines.push(stName(st) + 'が' + subName(menu, bl) + '（' + PRESS[press] + '）を担当。満足度' + C.sat + '。');
    if (C.press) {
      S.cash += TRIAL; S.wk.trial += TRIAL; C.revenue += TRIAL;
      lines.push(pressOutcome()); endVisit(C);
      C.phase = 'done';
      return { lines: lines, tone: C.sat >= 55 ? 'good' : 'bad' };
    }
    if (C.isNew) {
      S.cash += TRIAL; S.wk.trial += TRIAL; C.revenue += TRIAL;
      // スタッフも自分なりのトークで、興味を上げて警戒心をほぐす
      var it = 21 + C.int + C.sat * 0.5 + st.talk * 8 + sk(st, 'emp') * 3 + moodBonus(st) + (tr === 'talk' ? 10 : 0) + (tr === 'push' ? 12 : 0);
      var gd = C.grd - 6 - st.talk * 6 - sk(st, 'word') * 3 - (tr === 'heal' ? 18 : 0) + (tr === 'push' ? 12 : 0) - (S.hum - 30) * 0.2;
      var sc = it - gd * 0.7 + (C.sat - (C.vip ? 62 : 50)) * (C.vip ? 0.6 : 0.3), tier = C.budget + (roll(0.5) ? 1 : 0);
      var cand = (C.vip ? [VIPITEMS[0]] : []).concat(C.bride ? [BRIDAL] : []).concat(COURSES).filter(function (c) { return c.tier <= tier && sc >= needOf(c) - 8 && !(c.royal && C.sat < 70); })[0];
      if (cand) {
        if (roll(clamp(0.5 + (sc - needOf(cand)) / 40 + (tr === 'push' ? 0.12 : 0) + (has(st, 'machine') ? 0.15 : 0), 0.04, 0.96))) {
          applySale(C, cand); lines.push(cand.n + 'が成約した。');
          if (cand.big && ((tr === 'push' && roll(0.3)) || (C.sat < 45 && !has(st, 'charm') && roll(Math.max(0.05, 0.31 - sk(st, 'care') * 0.04))))) S.refunds.push({ c: C, n: cand.n, price: priceOf(cand) });
        } else lines.push(cand.n + 'をすすめたが、断られた。');
      } else lines.push('コースはすすめられなかった。');
      var pr = pickProd(C, inStock(), C.budget);
      if (pr && roll(clamp(0.15 + st.talk * 0.06 + (tr === 'shop' ? 0.3 : 0) + (S.gift ? 0.2 : 0) + (C.sat - 50) / 150 + (fits(pr, C) ? 0.12 : -0.05) + sk(st, 'know') * 0.03 + (S.snsProd === S.week ? 0.1 : 0) + (has(st, 'seller') ? 0.2 : 0), 0.03, 0.9))) {

        items.filter(function (x) { return x.sessions; })[0] || pp || OPTION;
      var p = clamp(0.5 + (regScore(st) - regNeed(choice)) / 40 + (choice.cost && fits(choice, C) ? 0.1 : 0) + (tr === 'shop' && choice.cost ? 0.25 : 0) + (tr === 'talk' && choice.sessions ? 0.1 : 0), 0.05, 0.95);
      if (roll(p)) { applySale(C, choice); lines.push(choice.n + 'をすすめて、買ってもらえた。'); }
      else lines.push(choice.n + 'をすすめたが、今日は見送られた。');

    if (tr === 'mood') lines.push('明るい接客で評判が上がった。');

    var rank = over ? 'E' : (profit >= RANKS[0] * sc ? 'S' : profit >= RANKS[1] * sc ? 'A' : profit >= RANKS[2] * sc ? 'B' : profit >= RANKS[3] * sc ? 'C' : 'D');
    var L = S.life, story = [];
    if (L.partner === 'married') story.push('結婚した'); else if (L.partner === 'dating') story.push('恋人がいる');
    if ((S.gens || []).length) story.push((S.gens.length + 1) + '代続く会社になった（' + S.gens.map(function (g) { return g.name; }).concat([S.ownerName || 'あなた']).join('→') + '）');
    if (S.startYear) story.push(S.startYear + '年に開業し、' + nowYear() + '年まで続いた');
    if (L.baby) story.push('子どもが生まれた'); if (L.dog) story.push('犬と暮らしている'); if (S.shops.length) story.push((1 + S.shops.length) + '店舗の経営者になった');
    var word = { S: '予約の取れない人気店になった。', A: '地域で評判の店に育った。', B: '堅実に黒字を積み上げた。', C: 'なんとか元手を守った。',
      D: '利益はほとんど残らなかった。合うメニューと提案を見直したい。', E: '資金が尽きて閉店した。' }[rank];
    var best = profit;
    if (!S.endless) try {
      var old = localStorage.getItem('salon-best24');
      if (old !== null && +old > best) best = +old;
      localStorage.setItem('salon-best24', String(best));
    } catch (err) {}
    if (rank === 'S' || rank === 'A') SFX.fanfare(true); else if (rank === 'E' || rank === 'D') SFX.sad(); else SFX.fanfare(false);
    var bkey = S.endless ? 'salon-best-endless' : 'salon-best24';
    if (S.endless) { best = profit; try { var o2 = localStorage.getItem(bkey); if (o2 !== null && +o2 > best) best = +o2; localStorage.setItem(bkey, String(best)); } catch (err) {} }
    var btns = [{ main: !final ? false : true, label: 'もう一度開業する', go: function () { clearGame(); heroStart(SLOT); } }];
    if (!final) btns.unshift({ main: true, label: 'このままお店を続ける', sub: '終わりのない延長戦へ。店じまいはいつでもできる', go: function () {
      S.endless = true; S.week++; startWeek(); } });
    view('<h1>' + wks + 'か月の結果</h1><p class="rank">' + rank + '</p><p>' + word + '</p>' + (story.length ? '<p class="lead">あなたは' + story.join('。') + '。</p>' : '') + '<div class="slip box"><dl>' +
      '<dt>売上の合計</dt><dd>' + yen(S.total.sales) + '</dd><dt>経費と投資の合計</dt><dd class="minus">' + yen(-S.total.cost) + '</dd>' +
      '<dt>残った在庫（仕入れ値）</dt><dd>' + yen(sv) + '</dd>' +
      '<div class="sum"></div><dt class="big">利益</dt><dd class="big' + (profit < 0 ? ' minus' : '') + '">' + yen(profit) + '</dd>' +
      '<dt>接客した人数</dt><dd>' + S.total.served + '人</dd><dt>成約した件数</dt><dd>' + S.total.sold + '件</dd>' +
      '<dt>通っている常連</dt><dd>' + S.clients.filter(function (c) { return c.active; }).length + '人</dd>' +
      '<dt>店舗</dt><dd>' + (1 + S.shops.length) + '店</dd><dt>スタッフ</dt><dd>' + allStaff().length + '人</dd><dt>人間力</dt><dd>' + S.hum + '</dd><dt>これまでの最高利益</dt><dd>' + yen(best) + '</dd></dl></div>',
      btns);
  }

  /* =========================================================
     途中から再開（この端末に保存）
     ========================================================= */
  var saveWarned = false, localNg = {};
  function saveOk() { saveWarned = false; }
  function warnPad() { var el = $('savewarn'), w = document.querySelector('.wrap'); w.style.paddingBottom = el.hidden ? '' : (el.offsetHeight + 28) + 'px'; }
  function saveFail() {
    if (saveWarned) return;
    saveWarned = true;
    var el = $('savewarn');
    el.innerHTML = '<p><b>保存できませんでした。</b>ゲームデータが最新の状態で保存されていない可能性があります。念のため、セーブコードを残してください。</p>' +
      '<p style="font-size:.78rem;color:var(--sub)">セーブコードは、月末の画面の「発信・記録・そのほか」からも書き出せます。</p>' +
      '<div class="row"><button type="button" class="main" id="swCode">セーブコードを表示する</button><button type="button" id="swClose">閉じる</button></div>';
    el.hidden = false; warnPad();
    $('swClose').onclick = function () { el.hidden = true; warnPad(); };
    $('swCode').onclick = function () {
      var raw = slotRaw(SLOT);
      if (!raw) return;
      encodeSave(raw).then(function (code) {
        el.innerHTML = '<p>下の文字列をまるごとコピーして、メモ帳などに残してください。別の端末やブラウザで「セーブコードを読み込む」に貼りつけると、つづきから遊べます。</p>' +
          '<textarea id="swText" readonly rows="4"></textarea><div class="row"><button type="button" class="main" id="swCopy">コピーする</button><button type="button" id="swClose2">閉じる</button></div>';
        var t = $('swText'); t.value = code;
        $('swClose2').onclick = function () { el.hidden = true; warnPad(); };
        warnPad();
        $('swCopy').onclick = function () {
          var ok = function () { $('swCopy').textContent = 'コピーした'; };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, function () { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} });
          else { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} }
        };
      });
    };
  }
  function saveGame(where) {
    if (!S) return;
    try {
      var pool = {};
      S.clients.concat(S.queue).forEach(function (c) { pool[c.id] = c; });
      S.refunds.forEach(function (r) { pool[r.c.id] = r.c; });
      var cust = Object.keys(pool).map(function (k) { var c = Object.assign({}, pool[k]); c.st = c.st ? c.st.id : null; return c; });
      var s2 = Object.assign({}, S, {
        clients: S.clients.map(function (c) { return c.id; }), queue: S.queue.map(function (c) { return c.id; }),
        refunds: S.refunds.map(function (r) { return { c: r.c.id, n: r.n, price: r.price }; }),
        evStaff: S.evStaff ? S.evStaff.id : null, quitRisk: S.quitRisk ? S.quitRisk.id : null
      });
      var str = JSON.stringify({ v: 1, where: where, S: s2, cust: cust, ts: Date.now() });
      var ok = false;
      try { localStorage.setItem(slotKey(SLOT), str); ok = true; } catch (e1) {}
      localNg[SLOT] = !ok;
      cloudPut(SLOT, str, where === 'night' || where === 'week');
      // この端末に保存できなかったとき：アカウント保存がなければ、すぐに知らせる（アカウント保存の結果は cloudFlush で判断）
      if (ok) saveOk(); else if (!cloud) saveFail();
    } catch (err) { saveFail(); }
  }
  function clearGame() {
    try { localStorage.removeItem(slotKey(SLOT)); } catch (err) {}
    cloudDel(SLOT);
  }
  function loadGame(n) {
    try {
      var raw = slotRaw(n || SLOT);
      if (!raw) return null;
      var d = JSON.parse(raw), s2 = d.S, sid = {}, cid = {};
      s2.staff.forEach(function (st) { sid[st.id] = st; });
      (s2.shops || []).forEach(function (b) { b.staff.forEach(function (st) { sid[st.id] = st; }); });
      d.cust.forEach(function (c) { c.st = (c.st !== null && c.st !== undefined) ? (sid[c.st] || null) : null; cid[c.id] = c; fixConcern(c); });
      s2.clients = s2.clients.map(function (i) { return cid[i]; }).filter(Boolean);
      s2.queue = s2.queue.map(function (i) { return cid[i]; }).filter(Boolean);
      s2.refunds = s2.refunds.map(function (r) { return { c: cid[r.c], n: r.n, price: r.price }; }).filter(function (r) { return r.c; });
      s2.evStaff = s2.evStaff !== null ? (sid[s2.evStaff] || null) : null;
      s2.quitRisk = s2.quitRisk !== null ? (sid[s2.quitRisk] || null) : null;
      return { where: d.where, S: s2 };
    } catch (err) { return null; }
  }
  /* --- セーブスロット（この端末と、claude.aiのアカウントの両方に保存） --- */
  var SLOT = 1, cloud = null, cloudCache = {}, cloudPend = {}, cloudBusy = {}, cloudTimer = {};
  function slotKey(n) { return 'salon-save-' + n; }
  function tsOf(raw) { try { return JSON.parse(raw).ts || 0; } catch (e) { return -1; } }
  function localRaw(n) { try { return localStorage.getItem(slotKey(n)); } catch (e) { return null; } }
  function slotRaw(n) {
    var a = localRaw(n), b = cloudCache[n] || null;
    if (!a) return b; if (!b) return a;
    return tsOf(b) > tsOf(a) ? b : a;
  }
  try { var old = localStorage.getItem('salon-save'); if (old) { if (!localStorage.getItem(slotKey(1))) localStorage.setItem(slotKey(1), old); localStorage.removeItem('salon-save'); } } catch (e) {}
  function cloudPut(n, str, now) {
    cloudCache[n] = str;
    if (!cloud) return;
    cloudPend[n] = str;
    clearTimeout(cloudTimer[n]);
    cloudTimer[n] = setTimeout(function () { cloudFlush(n); }, now ? 50 : 4000);
  }
  function cloudFlush(n) {
    if (cloudBusy[n] || cloudPend[n] === undefined) return;
    var str = cloudPend[n]; delete cloudPend[n]; cloudBusy[n] = true;
    var done = function () { cloudBusy[n] = false; if (cloudPend[n] !== undefined) cloudFlush(n); };
    var data = { json: str, ts: tsOf(str) };
    cloud.doc('slot' + n).set(data).then(function () { done(); if (localNg[n]) saveOk(); }, function () { done(); if (localNg[n]) saveFail(); });
  }
  function cloudDel(n) {
    delete cloudCache[n];
    if (!cloud) return;
    clearTimeout(cloudTimer[n]); delete cloudPend[n];
    var go = function () { if (cloudBusy[n]) return setTimeout(go, 300); cloudBusy[n] = true; cloud.doc('slot' + n).delete().then(function () { cloudBusy[n] = false; }, function () { cloudBusy[n] = false; }); };
    go();
  }
  // claude.ai にログインして開いていれば、アカウントにも保存する
  (function () {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return;
        var col = db.collection('data/users/' + id);
        return Promise.all([1, 2, 3].map(function (n) { return col.doc('slot' + n).get().then(function (sn) { if (sn.exists && sn.data() && sn.data().json) cloudCache[n] = String(sn.data().json); }); }))
          .then(function () {
            cloud = col;
            // この端末にしかないデータを、アカウントにも写しておく
            [1, 2, 3].forEach(function (n) { var a = localRaw(n); if (a && tsOf(a) > tsOf(cloudCache[n] || '')) cloudPut(n, a, true); });
            if (onTitle) title();
          });
      });
    }).catch(function () {});
  })();
  function slotInfo(n) {
    var raw = slotRaw(n);
    if (!raw) return null;
    try { var d = JSON.parse(raw); return { week: d.S.week, sy: d.S.startYear, cash: d.S.cash, shops: (d.S.shops || []).length, staff: d.S.staff.length, ts: d.ts || 0 }; } catch (e) { return null; }
  }
  function when(ts) { if (!ts) return ''; var d = new Date(ts); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
  function slotView(n, note) {
    var inf = slotInfo(n);
    bar();
    view('<h1>セーブ' + n + '</h1><p class="lead">' + (inf ? calOf(inf.week, inf.sy) + '　' + yen(inf.cash) + '　' + (1 + inf.shops) + '店舗' + (inf.ts ? '<br>最後に保存：' + when(inf.ts) : '') : '空きスロット') + '</p>' +
      (note ? '<div class="news ' + (note.bad ? 'bad' : 'good') + '">' + note.t + '</div>' : ''),
      (inf ? [{ main: true, label: 'つづきから遊ぶ', go: function () { SLOT = n; resumeGame(); } },
        { label: 'セーブコードを書き出す', sub: '別の端末やブラウザに引き継ぐための文字列', go: function () { codeOut(n); } }] :
        [{ main: true, label: 'ここで開業する', go: function () { heroStart(n); } }])
      .concat([{ label: 'セーブコードを読み込む', sub: inf ? 'このスロットのデータは上書きされる' : '書き出したコードを貼りつける', go: function () { codeIn(n); } }])
      .concat(inf ? [{ label: 'このデータを消す', sub: 'もとに戻せない', go: function () { view('<h1>セーブ' + n + 'を消す？</h1><p class="lead">消したデータはもとに戻せない。</p>', [
        { label: '消す', go: function () { SLOT = n; clearGame(); title(); } }, { main: true, label: 'やめる', go: function () { slotView(n); } }]); } }] : [])
      .concat([{ label: 'もどる', go: title }]));
  }
  // セーブコード（圧縮できる環境では圧縮）
  function b64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(s); }
  function unb64(t) { var s = atob(t), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function pipe(bytes, stream) { return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); }); }
  function encodeSave(raw) {
    var u = new TextEncoder().encode(raw);
    if (window.CompressionStream) return pipe(u, new CompressionStream('gzip')).then(function (z) { return 'SALONZ:' + b64(z); });
    return Promise.resolve('SALON0:' + b64(u));
  }
  function decodeSave(code) {
    code = String(code || '').replace(/\s+/g, '');
    try {
      if (code.indexOf('SALONZ:') === 0) {
        if (!window.DecompressionStream) return Promise.reject(new Error('z'));
        return pipe(unb64(code.slice(7)), new DecompressionStream('gzip')).then(function (u) { return new TextDecoder().decode(u); });
      }
      if (code.indexOf('SALON0:') === 0) return Promise.resolve(new TextDecoder().decode(unb64(code.slice(7))));
    } catch (e) {}
    return Promise.reject(new Error('bad'));
  }
  function codeOut(n, back) {
    var raw = slotRaw(n);
    if (!raw) return slotView(n);
    encodeSave(raw).then(function (code) {
      bar();
      view('<h1>セーブコード</h1><p class="lead">下の文字列をまるごとコピーして、メモ帳やdot.の自分用メモなどに残しておく。別の端末やブラウザで「セーブコードを読み込む」に貼りつけると、つづきから遊べる。</p>' +
        '<textarea id="code" readonly rows="6" style="width:100%;font-size:11px;word-break:break-all;border:2px solid var(--line);background:var(--panel);color:inherit;padding:6px">' + code + '</textarea><p class="lead" id="cmsg">' + code.length + '文字</p>',
        [{ main: true, label: 'コピーする', go: function () {
          var t = $('code'), ok = function () { $('cmsg').textContent = 'コピーした。'; };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, function () { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} });
          else { t.select(); try { document.execCommand('copy'); ok(); } catch (e) {} }
        } }, { label: 'もどる', go: back || function () { slotView(n); } }]);
    });
  }
  function codeIn(n) {
    bar();
    view('<h1>セーブコードを読み込む</h1><p class="lead">書き出したコードを貼りつけて「読み込む」を押す。セーブ' + n + 'に入る。</p>' +
      '<textarea id="code" rows="6" placeholder="SALONZ:..." style="width:100%;font-size:11px;word-break:break-all;border:2px solid var(--line);background:var(--panel);color:inherit;padding:6px"></textarea>',
      [{ main: true, label: '読み込む', go: function () {
        decodeSave($('code').value).then(function (raw) {
          var d = JSON.parse(raw);
          if (!d || !d.S || !d.cust) throw new Error('bad');
          d.ts = Date.now(); raw = JSON.stringify(d);
          try { localStorage.setItem(slotKey(n), raw); if (n === SLOT) saveOk(); } catch (e) { if (!cloud) saveFail(); }
          cloudPut(n, raw, true);
          slotView(n, { t: '読み込んだ。' + calOf(d.S.week) + 'のデータ。' });
        }).catch(function () { slotView(n, { bad: true, t: 'コードを読み込めなかった。最初から最後まで、欠けずに貼りつけられているか確かめてほしい。' }); });
      } }, { label: 'もどる', go: function () { slotView(n); } }]);
  }

  function resumeGame() {
    var d = loadGame();
    if (!d) return title();
    S = d.S; C = null; setScene('idle');
    S.endless = true;
    if (!S.px3) { (S.myProds || []).forEach(function (p) { p.price *= 3; }); S.px3 = true; }
    if (S.hum === undefined) S.hum = 30;
    if (S.fatigue === undefined) S.fatigue = 20;
    if (S.stamina === undefined) S.stamina = 40;
    if (!S.life) S.life = { partner: 'none', since: 0, dog: false, baby: false, done: {} };
    PRODUCTS.forEach(function (p) { if (S.stock && S.stock[p.k] === undefined) S.stock[p.k] = 0; });
    if (!S.shops) S.shops = [];
    if (!S.priceMode) S.priceMode = 'std';
    Object.assign(OWNER_LOOK, OWNER_LOOK0, S.ownerLook || {});
    if (S.interiorLv === undefined) S.interiorLv = S.interior ? 1 : 0;
    S.shops.forEach(function (b) { if (b.interiorLv === undefined) b.interiorLv = b.interior ? 1 : 0; });
    allStaff().forEach(function (st) { if (!st.owner) moodFix(st); });
    allStaff().forEach(function (st) { skFix(st); });
    S.shops.forEach(function (b) { b.staff.forEach(function (st) { st.area0 = b.area; }); });
    allStaff().forEach(function (st) {
      temperOf(st); talentOf(st);
      if (!st.owner && st.name.indexOf(' ') < 0 && st.name.indexOf('・') < 0) { var ar = st.area0 && WSUR[st.area0] && AREAS[st.area0].names && AREAS[st.area0].names.indexOf(st.name) >= 0 ? st.area0 : null; st.name = fullName(st.name, ar, st.id); }
      delete st.area0;
    });
    if (S.cands && !Array.isArray(S.cands) && Object.keys(S.cands).some(function (k) { return S.cands[k].some(function (c) { return !c.temper || c.gift === undefined; }); })) S.cands = null;
    if (!S.autoStock) S.autoStock = {};
    if (!S.myProds) S.myProds = [];
    if (d.where === 'batch') { bar(); if (S.idx >= S.queue.length) return night(); return view('<h1>' + calOf(S.week) + 'のつづき</h1><p class="lead">あと' + (S.queue.length - S.idx) + '人のお客様が待っている。</p>', [{ main: true, label: '営業を再開する', go: nextCust }]); }
    if (d.where === 'night') return investView();
    if (d.where === 'next') {
      S.idx++;
      if (S.idx >= S.queue.length) return night();
      bar();
      return view('<h1>' + calOf(S.week) + 'のつづき</h1><p class="lead">あと' + (S.queue.length - S.idx) + '人のお客様が待っている。</p>',
        [{ main: true, label: '次のお客様を迎える', go: nextCust }]);
    }
    weekIntro();
  }

  // タイトル画面には、最後に遊んだお店の内装を映す（読むだけで、データは変えない）
  function titlePreview() {
    var best = null;
    [1, 2, 3].forEach(function (n) {
      try { var d = JSON.parse(slotRaw(n)); if (d && d.S && (!best || (d.ts || 0) > best.ts)) best = { ts: d.ts || 0, persona: d.S.persona, lv: d.S.interiorLv || (d.S.interior ? 1 : 0) }; } catch (e) {}
    });
    return best;
  }
  function title() {
    S = null; C = null; scene.story = null; setScene('idle'); scene.preview = titlePreview();
    bar();
    view('<h1>エステ経営ものがたり</h1><p class="lead">小さなエステ店から始まる、終わりのない経営の物語。元手は' + yen(START) + '。</p>' +
      '<p class="lead" style="margin-top:12px">登場する人物と店はすべて架空。進み具合はセーブ1〜3に自動で保存される。' + (cloud ? 'claude.aiのアカウントにも保存中。' : 'この端末のブラウザに保存しているので、LINEなどのアプリ内ブラウザでは消えることがある。そのときはセーブコードで残しておける。') + '</p>',
      [1, 2, 3].map(function (n) {
        var inf = slotInfo(n);
        return { main: n === 1 && !!inf, label: 'セーブ' + n + '　' + (inf ? calOf(inf.week, inf.sy) + '　' + yen(inf.cash) : '空き'), sub: inf ? (1 + inf.shops) + '店舗・スタッフ' + inf.staff + '人' + (inf.ts ? '　' + when(inf.ts) : '') : 'ここで新しく開業する',
          go: function () { slotView(n); } };
      }));
    try { var lm = new Date(document.lastModified); if (!isNaN(lm)) $('app').insertAdjacentHTML('beforeend', '<p class="ver">更新：' + lm.getFullYear() + '/' + (lm.getMonth() + 1) + '/' + lm.getDate() + ' ' + lm.getHours() + ':' + ('0' + lm.getMinutes()).slice(-2) + '</p>'); } catch (err) {}
    onTitle = true;
  }
  (function () {
    var lastTap = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTap < 350 && e.touches.length === 0 && e.changedTouches.length === 1) {
        var el = e.target, tag = el && el.tagName;
        if (tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') { e.preventDefault(); if (el && el.click) el.click(); }
      }
      lastTap = now;
    }, { passive: false });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  })();
  title();
})();
</script>
